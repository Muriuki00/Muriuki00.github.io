<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#087df5"
  >

  <title>Sales Tracker</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <div class="app">

    <!-- Header -->

    <header class="header">

      <h1 id="businessName">
        Sales Tracker
      </h1>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </header>


    <!-- Dashboard summary -->

    <section class="summary">

      <div class="summary-item">

        <span
          id="salesToday"
          class="summary-number"
        >
          0
        </span>

        <span class="summary-label">
          SALES TODAY
        </span>

      </div>


      <div class="summary-item">

        <span
          id="revenueToday"
          class="summary-number"
        >
          0
        </span>

        <span class="summary-label">
          REVENUE (KSH)
        </span>

      </div>

    </section>


    <!-- Main navigation -->

    <nav class="tabs">

      <button
        id="inventoryTab"
        class="tab"
        type="button"
      >
        Inventory
      </button>

      <button
        id="itemsTab"
        class="tab active"
        type="button"
      >
        Items
      </button>

      <button
        id="historyTab"
        class="tab"
        type="button"
      >
        History
      </button>

    </nav>


    <!-- Main application area -->

    <main
      id="appContent"
      class="content"
    >

      <div class="empty-state">
        Application content will appear here.
      </div>

    </main>

  </div>


  <!-- Cart -->

  <div class="cart-bar">

    <button
      id="cartButton"
      class="cart-button"
      type="button"
    >
      Save Cart
    </button>

    <div
      id="cartCount"
      class="cart-count"
    >
      0 items
    </div>

  </div>


  <!-- Application JavaScript -->

  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
